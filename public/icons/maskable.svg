<!--
  Ikon maskable: latar memenuhi seluruh 512x512 (wajib untuk maskable),
  sedangkan konten bintang dibatasi ~207px sehingga berada di dalam
  safe zone 80% (lingkaran diameter 409.6px) dan tidak terpotong
  saat Android menerapkan mask circle/squircle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gacha Waifu">
  <defs>
    <linearGradient id="maskableStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0b0616" />
  <g transform="translate(256 256) scale(4.6) translate(-32 -32)">
    <path
      d="M32 7l6.8 15.6 16.9 1.6-12.7 11.2 3.6 16.6L32 43.7 17.4 52l3.6-16.6L8.3 24.2l16.9-1.6z"
      fill="url(#maskableStar)"
    />
    <circle cx="32" cy="32" r="5.2" fill="#fde68a" />
  </g>
</svg>
