<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <!-- Hanya favicon SVG yang disediakan. Tidak ada reference .ico karena
         file biner public/favicon.ico sengaja dihapus (tidak dapat dibuat
         dari source text). Browser modern (Chrome/Edge/Firefox/Safari 15+)
         mendukung favicon SVG. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4c1d95" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Gacha Waifu - simulator gacha untuk mengumpulkan waifu 3★ hingga 5★ dengan pity counter dan animasi rarity."
    />
    <!--
      apple-touch-icon SENGAJA tidak dipasang: iOS hanya menerima PNG 180x180,
      dan proyek ini tidak menyimpan aset biner di repo. Bila ingin ikon iOS
      yang proper, letakkan `public/apple-touch-icon.png` (180x180) lalu
      tambahkan:
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
      Lihat bagian "Ikon & PWA" di README untuk detail keterbatasan ini.
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Gacha Waifu</title>
  </head>
  <body>
    <noscript>Kamu perlu mengaktifkan JavaScript untuk menjalankan aplikasi ini.</noscript>
    <div id="root"></div>
  </body>
</html>
